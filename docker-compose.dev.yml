# Docker Compose pour développement
# Version simplifiée avec hot-reloading et debug activé
version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: kendeya-db-dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=kendeya_db_dev
      - POSTGRES_USER=kendeya_user
      - POSTGRES_PASSWORD=dev_password
    ports:
      - "5432:5432"
    networks:
      - kendeya-dev-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: kendeya-redis-dev
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"
    networks:
      - kendeya-dev-network

  # Application Django (mode développement)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kendeya-web-dev
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume_dev:/app/staticfiles
      - media_volume_dev:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-not-for-production
      - DATABASE_URL=postgresql://kendeya_user:dev_password@db:5432/kendeya_db_dev
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    depends_on:
      - db
      - redis
    networks:
      - kendeya-dev-network

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kendeya-celery-worker-dev
    command: celery -A config worker -l debug
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-not-for-production
      - DATABASE_URL=postgresql://kendeya_user:dev_password@db:5432/kendeya_db_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - kendeya-dev-network

  # Celery Beat
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kendeya-celery-beat-dev
    command: celery -A config beat -l debug --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-not-for-production
      - DATABASE_URL=postgresql://kendeya_user:dev_password@db:5432/kendeya_db_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - kendeya-dev-network

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  static_volume_dev:
    driver: local
  media_volume_dev:
    driver: local

networks:
  kendeya-dev-network:
    driver: bridge
