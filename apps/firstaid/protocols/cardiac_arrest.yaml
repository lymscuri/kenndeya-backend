  # ---------------------------------------------------------------------------
  # Défibrillateur automatisé externe (DAE), tel que décrit par l'IFRC (p.196-198).
  # À garder ou non selon le contexte : décision du médecin / du DG.
  # ---------------------------------------------------------------------------
  use_aed:
    title:
      fr: Utiliser le défibrillateur (DAE)
      en: Use the defibrillator (AED)
    variants:
      adult:
        - text:
            fr: Faites apporter le défibrillateur par un témoin, continuez la RCP pendant ce temps.
            en: Ask a bystander to bring the defibrillator, continue CPR in the meantime.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Allumez-le et suivez ses instructions vocales.
            en: Switch it on and follow the voice prompts.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Collez les électrodes sur la poitrine nue, comme indiqué sur le dessin.
            en: Apply the pads to the bare chest as shown in the instructions.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Pendant l'analyse, que personne ne touche la personne.
            en: During the analysis, make sure no one is touching the person.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Si un choc est indiqué, écartez tout le monde et appuyez sur le bouton.
            en: If a shock is advised, make sure nobody is touching, press the button.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Reprenez immédiatement les compressions après le choc.
            en: Resume chest compressions immediately after the shock.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 197}
        - text:
            fr: Interrompez la RCP le moins possible, seulement quand l'appareil le demande.
            en: Interrupt CPR as little as possible, only when the device tells you to.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Continuez la RCP jusqu'à l'arrivée des secours ou jusqu'à des signes de vie.
            en: Continue CPR until emergency help arrives or the person shows signs of life.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
      child:
        - text:
            fr: Faites apporter le défibrillateur par un témoin, continuez la RCP pendant ce temps.
            en: Ask a bystander to bring the defibrillator, continue CPR in the meantime.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 188}
        - text:
            fr: Utilisez un défibrillateur ou des électrodes pédiatriques si disponibles, sinon le standard.
            en: Use a paediatric defibrillator or pads if available, otherwise a standard one.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Allumez-le et suivez ses instructions vocales.
            en: Switch it on and follow the voice prompts.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Collez les électrodes sur la poitrine nue, comme indiqué sur le dessin.
            en: Apply the pads to the bare chest as shown in the instructions.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Si les électrodes se touchent, placez-en une devant et une dans le dos.
            en: If the pads would touch, put one on the front, one on the back.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 196}
        - text:
            fr: Pendant l'analyse, que personne ne touche l'enfant.
            en: During the analysis, make sure no one is touching the child.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Si un choc est indiqué, écartez tout le monde et appuyez sur le bouton.
            en: If a shock is advised, make sure nobody is touching, press the button.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Reprenez immédiatement les compressions après le choc.
            en: Resume chest compressions immediately after the shock.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 197}
        - text:
            fr: Continuez la RCP jusqu'à l'arrivée des secours ou jusqu'à des signes de vie.
            en: Continue CPR until emergency help arrives or the child shows signs of life.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 188}
      infant:
        - text:
            fr: Faites apporter le défibrillateur par un témoin, continuez la RCP pendant ce temps.
            en: Ask a bystander to bring the defibrillator, continue CPR in the meantime.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 188}
        - text:
            fr: Utilisez un défibrillateur ou des électrodes pédiatriques si disponibles, sinon le standard.
            en: Use a paediatric defibrillator or pads if available, otherwise a standard one.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Allumez-le et suivez ses instructions vocales.
            en: Switch it on and follow the voice prompts.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Collez une électrode sur la poitrine nue et une dans le dos.
            en: Apply one pad to the bare chest and one to the back.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 196}
        - text:
            fr: Pendant l'analyse, que personne ne touche le bébé.
            en: During the analysis, make sure no one is touching the baby.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Si un choc est indiqué, écartez tout le monde et appuyez sur le bouton.
            en: If a shock is advised, make sure nobody is touching, press the button.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 198}
        - text:
            fr: Reprenez immédiatement les compressions après le choc.
            en: Resume chest compressions immediately after the shock.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 197}
        - text:
            fr: Continuez la RCP jusqu'à l'arrivée des secours ou jusqu'à des signes de vie.
            en: Continue CPR until emergency help arrives or the baby shows signs of life.
          visual: ""
          source_page: {source: ifrc_2025_en, page: 188}

  # ---------------------------------------------------------------------------
  # Sans défibrillateur : poursuivre jusqu'aux secours ou aux signes de vie.
  # ---------------------------------------------------------------------------
  continue_cpr:
    title:
      fr: Poursuivre la réanimation
      en: Continue CPR
    steps:
      - text:
          fr: Continuez la RCP jusqu'à l'arrivée des secours ou jusqu'à des signes de vie.
          en: Continue CPR until emergency help arrives or the person shows signs of life.
        visual: ""
        source_page: {source: ifrc_2025_en, page: 188}
      - text:
          fr: "Signes de vie : tousser, ouvrir les yeux, parler, bouger volontairement, respirer normalement."
          en: "Signs of life: coughing, opening the eyes, speaking, moving purposefully, breathing normally."
        visual: ""
        source_page: {source: ifrc_2025_en, page: 162}
      - text:
          fr: À deux secouristes, relayez-vous toutes les deux minutes sans interrompre les compressions.
          en: With two providers, swap every two minutes without interrupting the compressions.
        visual: ""
        timer_seconds: 120
        source_page: {source: ifrc_2025_en, page: 162}
      - text:
          fr: Si elle se remet à respirer normalement, surveillez-la de près jusqu'aux secours.
          en: If they start breathing normally, keep monitoring closely until emergency services arrive.
        visual: ""
        source_page: {source: ifrc_2025_en, page: 163}

# Signes qui interrompent tout : l'application affiche « appelez les secours
# maintenant » puis bascule vers le scénario indiqué.
red_flags:
  - text:
      fr: La personne se remet à respirer normalement ou montre des signes de vie.
      en: The person starts breathing normally or shows signs of life.
    source_page: {source: ifrc_2025_en, page: 162}
    switch_to: unconscious_breathing

# Interdits : uniquement ceux présents dans le texte IFRC.
do_not:
  - text:
      fr: "Ne cherchez pas le pouls, ce n'est pas fiable : commencez la RCP."
      en: "Do not rely on checking for a pulse, it is unreliable: start CPR."
    source_page: {source: ifrc_2025_en, page: 159}
  - text:
      fr: "N'hésitez pas par peur de nuire : en cas de doute, commencez la RCP."
      en: "Do not hesitate for fear of causing harm: if in doubt, start CPR."
    source_page: {source: ifrc_2025_en, page: 159}
  - text:
      fr: N'interrompez pas les compressions, sauf si l'appareil ou les secours le demandent.
      en: Do not interrupt compressions unless the defibrillator or professionals tell you to.
    source_page: {source: ifrc_2025_en, page: 162}
  - text:
      fr: Ne vous appuyez pas sur la poitrine entre deux compressions.
      en: Do not lean on the chest between compressions.
    source_page: {source: ifrc_2025_en, page: 160}
  - text:
      fr: Ne retardez pas les compressions pour déplacer la personne sur une surface ferme.
      en: Do not significantly delay starting compressions to move the person.
    source_page: {source: ifrc_2025_en, page: 160}
  - text:
      fr: Ne décollez pas les électrodes une fois posées, même inversées.
      en: Do not remove the pads once applied, even if they are reversed.
    source_page: {source: ifrc_2025_en, page: 198}

# Points à trancher par le médecin relecteur (texte libre, bilingue, sans
# limite de mots). Rendus dans le dossier de relecture (firstaid_review).
review_notes:
  - fr: >-
      Ordre enfant/bébé : insufflations d'abord, selon la Key action (p.186) et
      la bonne pratique (p.187). Les étapes numérotées p.188 listent pourtant
      les 30 compressions avant les 2 insufflations initiales. Confirmer l'ordre.
    en: >-
      Child/baby order: rescue breaths first, following the Key action (p.186)
      and the good practice point (p.187). Yet the numbered steps on p.188 list
      30 compressions before the 2 initial breaths. Confirm the order.
  - fr: >-
      Insufflations initiales : 2 (p.188). L'IFRC laisse les programmes choisir
      2 ou 5 (p.190). Garder 2 ?
    en: >-
      Initial rescue breaths: 2 (p.188). IFRC lets programmes choose 2 or 5
      (p.190). Keep 2?
  - fr: >-
      Ratio 15:2 réservé aux secouristes formés ou à deux secouristes (p.188-189),
      non inclus : grand public = 30:2.
    en: >-
      15:2 ratio reserved for trained providers or two rescuers (p.188-189), not
      included: lay public = 30:2.
  - fr: >-
      Bébé : technique à deux doigts retenue. La méthode des deux pouces mains
      encerclant le thorax, préférée chez le nouveau-né (p.186), n'est pas décrite.
    en: >-
      Baby: two-finger technique kept. The two-thumb-encircling method, preferred
      in newborns (p.186), is not described.
  - fr: >-
      Adolescent : « RCP avec insufflations préférée » (p.161) n'est pas
      différencié de l'adulte dans l'arbre, seulement dans le libellé de variante.
    en: >-
      Adolescent: "CPR with rescue breaths is preferred" (p.161) is not
      distinguished from adults in the tree, only in the variant label.
  - fr: >-
      Seul sans haut-parleur, enfant/bébé : « une minute de RCP avant d'aller
      appeler » (p.188) non inclus, car contraire à l'affichage « appel d'abord ».
      À arbitrer selon la disponibilité des SMU en Guinée.
    en: >-
      Alone without speakerphone, child/baby: "perform CPR for one minute before
      pausing to call" (p.188) not included, as it conflicts with the
      call-first banner. Decide according to EMS availability in Guinea.
  - fr: >-
      DAE : bloc isolé derrière la question « DAE disponible ? ». Non inclus :
      rasage, soutien-gorge, forte poitrine, placement antéro-latéral détaillé,
      « seul et DAE visible : aller le chercher » (p.198), écart 1-2 cm entre
      électrodes (p.189). Garder le bloc DAE pour le contexte guinéen ?
    en: >-
      AED: isolated block behind the "AED available?" question. Not included:
      chest hair removal, bra, large breasts, detailed anterolateral placement,
      "alone and AED visible: go and get it" (p.198), 1-2 cm gap between pads
      (p.189). Keep the AED block for the Guinean context?
  - fr: >-
      Arrêt de la RCP : règle « 20 minutes sans SMU, sauf noyade et hypothermie »
      (adaptation locale p.188) et dignité sans soins avancés (p.161) non mises
      en étape. Décision pour la Guinée.
    en: >-
      Stopping CPR: the "20 minutes without EMS, except drowning and hypothermia"
      rule (local adaptation p.188) and dignity without advanced care (p.161)
      are not steps. Decision for Guinea.
  - fr: >-
      Tuberculose : l'IFRC permet de décourager les insufflations en zone de forte
      prévalence (p.164, p.189). La question « acceptez-vous le bouche-à-bouche ? »
      laisse le choix à l'utilisateur ; imposer compressions seules ?
    en: >-
      Tuberculosis: IFRC allows discouraging rescue breaths where prevalence is
      high (p.164, p.189). The "willing to give mouth-to-mouth?" question leaves
      the choice to the user; impose compression-only instead?
  - fr: >-
      Noyade et hypothermie : « continuer la RCP même sans défibrillation » (p.162)
      non inclus ; scénario séparé à prévoir.
    en: >-
      Drowning and hypothermia: "continue CPR even when defibrillation is not
      feasible" (p.162) not included; separate scenario to plan.
  - fr: >-
      Convulsions brèves possibles au début d'un arrêt cardiaque (p.161) : non
      mentionnées, à relier à un futur protocole « convulsions ».
    en: >-
      Brief seizure-like activity possible at the start of cardiac arrest (p.161):
      not mentioned, to link with a future "seizure" protocol.
  - fr: >-
      Timer de 18 secondes sur les séries de 30 compressions : déduit de 100 à 120
      par minute (15 à 18 s), ce n'est pas une valeur IFRC explicite.
    en: >-
      18-second timer on 30-compression series: derived from 100 to 120 per
      minute (15 to 18 s), not an explicit IFRC value.

