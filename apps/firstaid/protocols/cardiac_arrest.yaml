id: cardiac_arrest
title: Personne inconsciente qui ne respire pas normalement
description: >-
  La personne ne réagit pas et ne respire pas, ou respire anormalement
  (halètements, souffle irrégulier). Il faut commencer la réanimation
  cardio-pulmonaire immédiatement. Protocole à rédiger.
version: 1
