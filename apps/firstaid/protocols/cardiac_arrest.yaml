variants: {}

decision_tree:
  entry: q_breathing_normal
  questions:
    q_breathing_normal:
      text: La personne respire-t-elle normalement ?
      answers:
        "yes":
          label: Oui
          switch_to: unconscious_breathing
        "no":
          label: Non, elle ne respire pas ou respire anormalement
          action_block: start_cpr

action_blocks:
  start_cpr:
    title: Réanimation cardio-pulmonaire
    steps:
