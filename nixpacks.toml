# Railway (Nixpacks). Python vient de Nix : son loader ignore /usr/lib/x86_64-linux-gnu.
# Le wheel manylinux de pyosmium (paquet osmium, import des lieux de santé OSM) a besoin
# de libexpat.so.1, libz.so.1, libstdc++.so.6 et libgcc_s.so.1 : nixLibs les installe
# dans le store Nix.
#
# Nixpacks n'ajoute pas ces répertoires à LD_LIBRARY_PATH, et la section [variables]
# ci-dessous n'atteint pas non plus l'environnement d'exécution (constaté le 2026-11-10 :
# la variable reste "/usr/lib"). Le réglage EFFECTIF est la variable de service Railway
# LD_LIBRARY_PATH (voir CLAUDE.md), qui reprend exactement cette valeur. Les hashes sont
# ceux du nixpkgs épinglé par Nixpacks : si Railway change de version de Nixpacks,
# `import osmium` échoue (ImportError libz/libexpat) et il faut relever les nouveaux
# chemins (`ls -d /nix/store/*-expat-*/lib /nix/store/*-zlib-*/lib /nix/store/*-gcc-*-lib/lib`).
[phases.setup]
nixLibs = ["expat", "zlib", "stdenv.cc.cc.lib"]

[variables]
LD_LIBRARY_PATH = "/nix/store/cnmw0v80xbp4ldc79an5kb2p8a3ia6k5-expat-2.6.3/lib:/nix/store/ncjma3lhr1sf6mqaczl9mfhjmp6ix58w-zlib-1.3.1/lib:/nix/store/s94fwp43xhzkvw8l8nqslskib99yifzi-gcc-13.3.0-lib/lib:/usr/lib"
