          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
    delete:
      operationId: dossiers_patients_destroy
      description: |-
        Récupère, modifie ou supprime un patient.

        GET /api/v1/dossiers/patients/:id/
        PATCH /api/v1/dossiers/patients/:id/
        DELETE /api/v1/dossiers/patients/:id/
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dossiers
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '204':
          description: No response body
  /api/v1/dossiers/patients/{patient_id}/consultations/:
    get:
