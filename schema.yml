  /api/v1/dossiers/patients/{patient_id}/:
    get:
      operationId: dossiers_patients_retrieve_2
      description: |-
        Récupère, modifie ou supprime un patient.

        GET /api/v1/dossiers/patients/:id/
        PATCH /api/v1/dossiers/patients/:id/
        DELETE /api/v1/dossiers/patients/:id/
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dossiers
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
    patch:
      operationId: dossiers_patients_partial_update
      description: |-
        Récupère, modifie ou supprime un patient.

        GET /api/v1/dossiers/patients/:id/
        PATCH /api/v1/dossiers/patients/:id/
        DELETE /api/v1/dossiers/patients/:id/
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - dossiers
      security:
      - jwtAuth: []
