openapi: 3.0.3
info:
  title: Kendeya Backend API
  version: 1.0.0
  description: API REST pour la plateforme de gestion médicale Kendeya (Guinée)
  contact:
    name: Équipe Kendeya
    email: support@kendeya.com
  license:
    name: Propriétaire
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: |-
        Change le mot de passe de l'utilisateur connecté.

        POST /api/v1/auth/change-password/
        Body: {
            "old_password": "oldpassword",
            "new_password": "newpassword",
            "new_password_confirm": "newpassword"
        }
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Connexion d'un utilisateur existant.

        POST /api/v1/auth/login/
        Body: {
            "email": "user@example.com",
            "password": "securepassword"
        }
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Déconnexion d'un utilisateur (blacklist du refresh token).

        POST /api/v1/auth/logout/
        Body: {
            "refresh": "refresh_token_here"
        }
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        Récupère les informations de l'utilisateur connecté.

        GET /api/v1/auth/me/
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
  /api/v1/auth/profile/:
    patch:
      operationId: auth_profile_partial_update
      description: |-
        Met à jour le profil de l'utilisateur connecté.

        PATCH /api/v1/auth/profile/
        Body: {
            "first_name": "John",
            "last_name": "Doe",
            "phone": "+224XXXXXXXXX"
        }
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Inscription d'un nouvel utilisateur.

        POST /api/v1/auth/register/
        Body: {
            "email": "user@example.com",
            "password": "securepassword",
            "password_confirm": "securepassword",
            "first_name": "John",
            "last_name": "Doe",
            "phone": "+224XXXXXXXXX",
            "role": "patient"
        }
      tags:
      - auth
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/dossiers/patients/:
    get:
      operationId: dossiers_patients_retrieve
      description: |-
        Liste tous les patients du médecin connecté ou crée un nouveau patient.

        GET /api/v1/dossiers/patients/
        POST /api/v1/dossiers/patients/
      tags:
      - dossiers
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          description: No response body
    post:
      operationId: dossiers_patients_create
      description: |-
        Liste tous les patients du médecin connecté ou crée un nouveau patient.

        GET /api/v1/dossiers/patients/
        POST /api/v1/dossiers/patients/
      tags:
      - dossiers
      security:
      - jwtAuth: []
      - bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
